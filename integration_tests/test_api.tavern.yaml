
test_name: eiendom med 3 teiger

strict:
  - headers:off
  - json:off

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/geokoding"
      params:
        matrikkelnummer: '3413-339/42'
      method: GET
      timeout: 1
      headers:
        content-type: application/json
    response:
      status_code: 200
      json:
        features:
          - properties:
              objekttype: 'Teig'

