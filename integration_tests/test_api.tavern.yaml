test_name: Søk på feilformatert matrikkelnummer

strict:
  - headers:off
  - json:on

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/geokoding"
      params:
        matrikkelnummer: '3413-6/501\0/2'
      method: GET
      timeout: 1
      headers:
        content-type: application/json
    response:
      status_code: 400
      json:
        errors:
          message: 'Ugyldig(e) tegn i søkeparameteret. Husk på at matrikkelnummer bruker skråstreker /, og ikke bakstreker (omvendt skråstrek) \.'


