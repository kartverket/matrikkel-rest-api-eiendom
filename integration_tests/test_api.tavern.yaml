test_name: Transformer respons, inkluder crs-element

strict:
  - headers:off
  - json:off

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/geokoding"
      params:
        matrikkelnummer: '3413-6/501/0/2'
        utkoordsys: 25833
      method: GET
      timeout: 1
      headers:
        content-type: application/json
    response:
      status_code: 200
      json:
        crs:
          type: 'name'
          properties:
            name: 'EPSG:25833'
        type: FeatureCollection
        features:
          - type: 'Feature'
            properties:
              matrikkelnummertekst: "6/501/0/2"
            geometry:
              type: 'Point'
              coordinates:
                - 288280.5061
                - 6744905.414
