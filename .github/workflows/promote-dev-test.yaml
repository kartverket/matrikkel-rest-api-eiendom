name: Promote Dev to Test
on: workflow_dispatch

jobs:
  deploy-argo:
    uses: kartverket/smia-apps/.github/workflows/promote-app.yml@main
    with:
      application: eiendom
      from_env: dev
      to_env: test
      namespace: smia-tjenester-main
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}
